spring:
  application:
    name: habit-tracker
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://localhost:5432/habit_tracker
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jwt:
    secret: ${JWT_SECRET:default-secret-for-local-dev-only}
    expiration: 86400000