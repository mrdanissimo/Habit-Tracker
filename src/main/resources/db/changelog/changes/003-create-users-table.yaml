databaseChangeLog:
  - changeSet:
      id: 003-create-users-table
      author: mrdanissimo
      changes:
      - createTable:
          tableName: users
          columns:
          - column:
              name: id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false
          - column:
              name: username
              type: VARCHAR(255)
              constraints:
                nullable: false
                unique: true
          - column:
              name: password
              type: VARCHAR(255)
              constraints:
                nullable: false
          - column:
              name: email
              type: VARCHAR(255)
  - changeSet:
      id: 003-add-user-id-to-habits
      author: mrdanissimo
      changes:
        - addColumn:
            tableName: habits
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_habits_user
                    references: users(id)